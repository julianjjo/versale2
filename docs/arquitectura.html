<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arquitectura de Versale</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f6f3ee;                 /* cream */
      --color-ink:     #1a1a1a;
      --color-muted:   #7a6a55;                 /* warm brown */
      --color-soft:    #9c8d78;
      --color-accent:  #c8623a;                 /* terracotta */
      --color-link:    #2563eb;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-serif:    'Fraunces', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Monorepo Versale</p>
    <h1>Arquitectura de Versale</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="versale-arquitectura-title versale-arquitectura-desc">
      <title id="versale-arquitectura-title">Arquitectura del monorepo Versale</title>
      <desc id="versale-arquitectura-desc">Diagrama de arquitectura del monorepo Versale: el navegador accede a la web Next.js, que consume la API NestJS mediante REST; la API persiste en SQLite vía Prisma y envía emails transaccionales vía Brevo, mientras Playwright ejecuta pruebas e2e contra puertos dedicados.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a6a55"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c8623a"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f6f3ee"/>

      <!-- ===== ZONE: monorepo apps (antes de flechas y nodos) ===== -->
      <rect x="288" y="192" width="912" height="256" rx="8" fill="rgba(26,26,26,0.02)" stroke="rgba(26,26,26,0.10)" stroke-width="0.8"/>
      <rect x="316" y="196" width="308" height="12" rx="2" fill="#f6f3ee"/>
      <text x="320" y="205" fill="rgba(26,26,26,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em">VERSALE MONOREPO — NPM WORKSPACES</text>

      <!-- ===== ARROWS (antes de los nodos) ===== -->
      <!-- browser -> web -->
      <line x1="224" y1="328" x2="312" y2="328" stroke="#7a6a55" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="244" y="308" width="52" height="12" rx="2" fill="#f6f3ee"/>
      <text x="270" y="317" fill="#9c8d78" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

      <!-- web -> api -->
      <line x1="552" y1="328" x2="624" y2="328" stroke="#7a6a55" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="564" y="308" width="48" height="12" rx="2" fill="#f6f3ee"/>
      <text x="588" y="317" fill="#9c8d78" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REST</text>

      <!-- api -> sqlite -->
      <line x1="928" y1="328" x2="992" y2="328" stroke="#7a6a55" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="936" y="308" width="56" height="12" rx="2" fill="#f6f3ee"/>
      <text x="964" y="317" fill="#9c8d78" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRISMA</text>

      <!-- api -> brevo (externo, HTTP) -->
      <line x1="780" y1="408" x2="780" y2="512" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="788" y="456" width="56" height="12" rx="2" fill="#f6f3ee"/>
      <text x="792" y="465" fill="#9c8d78" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">EMAILS</text>

      <!-- e2e -> web (opcional, punteada) -->
      <line x1="436" y1="120" x2="436" y2="264" stroke="rgba(26,26,26,0.35)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="376" y="184" width="48" height="12" rx="2" fill="#f6f3ee"/>
      <text x="380" y="193" fill="#9c8d78" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">:3100</text>

      <!-- e2e -> api (opcional, punteada) -->
      <line x1="780" y1="120" x2="780" y2="240" stroke="rgba(26,26,26,0.35)" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="788" y="172" width="48" height="12" rx="2" fill="#f6f3ee"/>
      <text x="792" y="181" fill="#9c8d78" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">:3101</text>

      <!-- ===== NODES ===== -->
      <!-- Browser (input) -->
      <rect x="64" y="280" width="160" height="96" rx="6" fill="#f6f3ee"/>
      <rect x="64" y="280" width="160" height="96" rx="6" fill="rgba(122,106,85,0.10)" stroke="#9c8d78" stroke-width="1"/>
      <rect x="72" y="286" width="48" height="12" rx="2" fill="transparent" stroke="rgba(156,141,120,0.40)" stroke-width="0.8"/>
      <text x="96" y="295" fill="rgba(156,141,120,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLIENTE</text>
      <text x="144" y="330" fill="#1a1a1a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Navegador</text>
      <text x="144" y="350" fill="#7a6a55" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">comprador / vendedor</text>

      <!-- Next.js Web (backend) -->
      <rect x="320" y="272" width="232" height="112" rx="6" fill="#f6f3ee"/>
      <rect x="320" y="272" width="232" height="112" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
      <rect x="328" y="278" width="36" height="12" rx="2" fill="transparent" stroke="rgba(26,26,26,0.40)" stroke-width="0.8"/>
      <text x="346" y="287" fill="rgba(26,26,26,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="436" y="324" fill="#1a1a1a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Next.js Web</text>
      <text x="436" y="344" fill="#7a6a55" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">apps/web · React Query</text>
      <text x="436" y="362" fill="#9c8d78" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">:3000 dev</text>

      <!-- NestJS API (focal) -->
      <rect x="632" y="248" width="296" height="160" rx="6" fill="#f6f3ee"/>
      <rect x="632" y="248" width="296" height="160" rx="6" fill="rgba(200,98,58,0.08)" stroke="#c8623a" stroke-width="1.2"/>
      <rect x="640" y="254" width="36" height="12" rx="2" fill="transparent" stroke="rgba(200,98,58,0.40)" stroke-width="0.8"/>
      <text x="658" y="263" fill="rgba(200,98,58,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="780" y="300" fill="#1a1a1a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">NestJS API</text>
      <text x="780" y="320" fill="#7a6a55" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">apps/api · :3001 dev</text>
      <text x="780" y="344" fill="#9c8d78" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">auth · users · products · cart</text>
      <text x="780" y="362" fill="#9c8d78" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">orders · reviews · favorites · questions</text>
      <text x="780" y="380" fill="#9c8d78" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">uploads · reports · notifications</text>

      <!-- SQLite via Prisma (store) -->
      <rect x="1000" y="280" width="176" height="96" rx="6" fill="#f6f3ee"/>
      <rect x="1000" y="280" width="176" height="96" rx="6" fill="rgba(26,26,26,0.05)" stroke="#7a6a55" stroke-width="1"/>
      <rect x="1008" y="286" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,106,85,0.40)" stroke-width="0.8"/>
      <text x="1022" y="295" fill="rgba(122,106,85,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="1088" y="326" fill="#1a1a1a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">SQLite</text>
      <text x="1088" y="346" fill="#7a6a55" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Prisma ORM · dev / e2e.db</text>

      <!-- Brevo (external) -->
      <rect x="664" y="520" width="232" height="80" rx="6" fill="#f6f3ee"/>
      <rect x="664" y="520" width="232" height="80" rx="6" fill="rgba(26,26,26,0.03)" stroke="rgba(26,26,26,0.30)" stroke-width="1"/>
      <rect x="672" y="526" width="32" height="12" rx="2" fill="transparent" stroke="rgba(26,26,26,0.30)" stroke-width="0.8"/>
      <text x="688" y="535" fill="rgba(26,26,26,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="780" y="560" fill="#1a1a1a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Brevo</text>
      <text x="780" y="580" fill="#7a6a55" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">emails transaccionales</text>

      <!-- Playwright e2e (optional, dashed) -->
      <rect x="400" y="56" width="376" height="64" rx="6" fill="#f6f3ee"/>
      <rect x="400" y="56" width="376" height="64" rx="6" fill="rgba(26,26,26,0.02)" stroke="rgba(26,26,26,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="408" y="62" width="44" height="12" rx="2" fill="transparent" stroke="rgba(26,26,26,0.30)" stroke-width="0.8"/>
      <text x="430" y="71" fill="rgba(26,26,26,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">E2E</text>
      <text x="588" y="92" fill="#1a1a1a" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Playwright e2e</text>
      <text x="588" y="110" fill="#7a6a55" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">suites + seed · apps/api/e2e.db</text>

      <!-- ===== LEGEND (strip inferior) ===== -->
      <line x1="32" y1="648" x2="1248" y2="648" stroke="rgba(26,26,26,0.10)" stroke-width="0.8"/>
      <text x="32" y="676" fill="#7a6a55" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEYENDA</text>

      <rect x="128" y="666" width="24" height="14" rx="2" fill="rgba(200,98,58,0.08)" stroke="#c8623a" stroke-width="1"/>
      <text x="164" y="676" fill="#7a6a55" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FOCAL</text>

      <rect x="288" y="666" width="24" height="14" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
      <text x="324" y="676" fill="#7a6a55" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FRONTEND / API</text>

      <rect x="504" y="666" width="24" height="14" rx="2" fill="rgba(26,26,26,0.05)" stroke="#7a6a55" stroke-width="1"/>
      <text x="540" y="676" fill="#7a6a55" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">DATOS</text>

      <rect x="660" y="666" width="24" height="14" rx="2" fill="rgba(26,26,26,0.03)" stroke="rgba(26,26,26,0.30)" stroke-width="1"/>
      <text x="696" y="676" fill="#7a6a55" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">EXTERNO</text>

      <line x1="800" y1="673" x2="824" y2="673" stroke="rgba(26,26,26,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="836" y="676" fill="#7a6a55" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">OPCIONAL (PRUEBAS)</text>

      <line x1="1032" y1="673" x2="1056" y2="673" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="1068" y="676" fill="#7a6a55" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HTTP / API</text>
    </svg>
  </div>
</body>
</html>
