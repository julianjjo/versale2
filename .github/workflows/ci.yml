name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  api-tests:
    name: API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate
      # apps/api has a large pre-existing lint backlog (~5.8k errors); run it
      # for visibility but don't block merges on it until that's cleaned up.
      # lint:ci (not lint) because the `lint` script carries --fix: a CI lint
      # must report what a fresh checkout contains, not silently rewrite the
      # runner's working copy before build/tests run against it.
      - name: Lint API (non-blocking)
        run: npm run lint:ci --workspace=apps/api
        continue-on-error: true
      # Mandatory gate: every PR must keep the files it actually touches
      # lint-clean, even while the pre-existing backlog above is still
      # being paid down. Only files changed vs. the PR base are linted.
      - name: Lint changed API files (required)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "$GITHUB_BASE_REF" --depth=1
          CHANGED=$(git diff --name-only --diff-filter=ACMR "origin/$GITHUB_BASE_REF...HEAD" | grep -E '^apps/api/.*\.tsx?$' | sed 's#^apps/api/##' || true)
          if [ -z "$CHANGED" ]; then
            echo "No changed API TypeScript files to lint."
          else
            echo "Linting changed API files:"
            echo "$CHANGED"
            (cd apps/api && echo "$CHANGED" | xargs npx eslint)
          fi
      - name: Build API
        run: npm run build --workspace=apps/api
      - name: Run API tests
        run: npm run test:cov --workspace=apps/api
      - name: Upload API coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: api
          files: apps/api/coverage/lcov.info

  web-tests:
    name: Web unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint Web
        run: npm run lint --workspace=apps/web
      - name: Build Web
        run: npm run build --workspace=apps/web
      - name: Run Web tests
        run: npm run test:coverage --workspace=apps/web
      - name: Upload Web coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: web
          files: apps/web/coverage/lcov.info

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [api-tests, web-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        run: npm run e2e
        env:
          CI: "true"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Branch protection on main requires a single "CI" status check. The jobs
  # above post checks under their own names, so this gate job is what
  # actually satisfies that requirement — it only succeeds once the required
  # jobs have. e2e is intentionally not a dependency here: it's slower and
  # more environment-sensitive, so it reports status without gating merges
  # until it's proven stable in CI.
  #
  # `if: always()` + explicit result check (instead of relying on plain
  # `needs` semantics): when a required job fails, a plain-needs gate job is
  # SKIPPED, and a skipped required check renders as a grey/neutral marker —
  # fail-closed for merging, but easy to misread as "not run yet". Running
  # the gate unconditionally and failing it explicitly turns that into an
  # unambiguous red X on the exact commit that broke CI.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [api-tests, web-tests]
    if: always()
    steps:
      - name: Fail if any required job did not pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Required jobs did not all pass:"
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: echo "Required checks passed"
